[package]
name = "ironcalc_lotus"
version = "0.8.3"
authors = ["IronCalc <info@ironcalc.com>"]
edition = "2021"
homepage = "https://www.ironcalc.com"
repository = "https://github.com/ironcalc/ironcalc/"
description = "Lotus 1-2-3 (.WK3) import for IronCalc"
license = "MIT OR Apache-2.0"

[dependencies]
# Deliberately the published crate, NOT `path = "../base"`.  Consumers
# (l123) build against crates.io `ironcalc`, which carries its own
# `ironcalc_base`; a path dep here would put a second, newer copy of the
# same crate in their graph and the two would not unify.
ironcalc_base = "0.8"
thiserror = "1.0"
bitcode = "0.6.8"

[lib]
name = "ironcalc_lotus"
path = "src/lib.rs"

[[bin]]
name = "wk3_2_icalc"
path = "src/bin/wk3_2_icalc.rs"

[build-dependencies]

[dev-dependencies]
